<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login • Kokoro</title>
  <style>
    body{font-family:system-ui,Inter,Segoe UI,Roboto,Arial,sans-serif;background:#0f1115;color:#eaeaea;display:grid;place-items:center;min-height:100vh;margin:0;padding:16px;box-sizing:border-box;overflow-x:hidden}
    .card{width:100%;max-width:380px;background:#131721;border:1px solid #2a2f3a;border-radius:16px;padding:24px;box-sizing:border-box}
    input,button{width:100%;padding:12px;border-radius:10px;border:1px solid #2a2f3a;background:#0f1115;color:#eaeaea;margin-top:10px;box-sizing:border-box}
    button{cursor:pointer;font-weight:600}
    button:hover{background:#1a1f2e}
    .err{color:#ff7b7b;min-height:20px;margin-top:8px;font-size:14px}
    .logo{text-align:center;margin-bottom:20px;font-size:28px;font-weight:900;letter-spacing:2px}
    .back{text-align:center;margin-top:16px}
    .back a{color:#94a3b8;text-decoration:none;font-size:13px}
    .back a:hover{color:#eaeaea}
  
    @media (max-width:480px){
      body{
        padding:12px;
        min-height:100dvh;
        align-items:center;
      }

      .card{
        max-width:100%;
        padding:20px 16px;
        border-radius:14px;
      }

      input,button{
        min-height:46px;
        font-size:16px;
      }
    }

  </style>
</head>
<body>
<div class="card">
  <div class="logo">KOKORO</div>
  <h2 style="text-align:center;margin:0 0 20px">Entrar</h2>
  <form id="f">
    <input type="email" id="email" placeholder="E-mail" required>
    <input type="password" id="senha" placeholder="Senha" required>
    <button type="submit">Login</button>
    <div class="err" id="err"></div>
  </form>
  <div class="back">
    <a href="/">← Voltar ao site</a>
  </div>
</div>

<script>

document.getElementById('f').addEventListener('submit', async function(e) {
  e.preventDefault();

  const email = document.getElementById('email').value.trim();
  const campoSenha = document.getElementById('senha');
  const senha = campoSenha.value;
  const aviso = document.getElementById('err');
  const botao = document.querySelector('#f button[type="submit"]');

  botao.disabled = true;
  aviso.textContent = 'Verificando acesso...';

  try {
    const resposta = await fetch('/api/auth/usuario-login', {
      method: 'POST',
      credentials: 'same-origin',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email, senha })
    });

    if (!resposta.ok) {
      aviso.textContent = 'Credenciais invalidas ou acesso indisponivel.';
      return;
    }

    const perfil = await fetch('/api/perfil/me', {
      credentials: 'same-origin',
      cache: 'no-store'
    });

    if (!perfil.ok) {
      aviso.textContent = 'Nao foi possivel validar o perfil.';
      return;
    }

    const dados = await perfil.json();

    if (!dados.ok || !['aluno', 'professor'].includes(dados.perfil)) {
      aviso.textContent = 'Perfil nao autorizado.';
      return;
    }

    if (dados.perfil === 'aluno') {
      window.location.replace('/dashboard_aluno.html');
      return;
    }

    const respostaProfessor = await fetch('/api/perfil/professor', {
      credentials: 'same-origin',
      cache: 'no-store'
    });

    if (!respostaProfessor.ok) {
      aviso.textContent = 'Perfil de professor indisponivel.';
      return;
    }

    const dadosProfessor = await respostaProfessor.json();

    const tipo = String(
      dadosProfessor?.professor?.tipo || ''
    ).trim().toUpperCase();

    const destino =
      tipo === 'TITULAR'
        ? '/dashboard_professor_titular.html'
        : tipo === 'AUXILIAR'
          ? '/dashboard_professor_aux.html'
          : null;

    if (!destino) {
      aviso.textContent = 'Tipo de professor nao autorizado.';
      return;
    }

    window.location.replace(destino);
    return;

  } catch {
    aviso.textContent = 'Falha de comunicacao com o servidor.';
  } finally {
    campoSenha.value = '';
    botao.disabled = false;
  }
});
</script>
</body>
</html>
