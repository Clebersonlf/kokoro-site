<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Controle de Sessões</title>

<style>
body{
    font-family: Arial, sans-serif;
    background:#0f172a;
    color:#fff;
    padding:20px;
}

.container{
    max-width:1200px;
    margin:auto;
}

h1{
    margin-bottom:20px;
}

.grid{
    display:grid;
    grid-template-columns: repeat(auto-fit,minmax(300px,1fr));
    gap:20px;
}

.card{
    background:#1e293b;
    padding:20px;
    border-radius:12px;
}

.card h2{
    margin-bottom:10px;
}

input, select, textarea{
    width:100%;
    padding:8px;
    margin-top:6px;
    margin-bottom:10px;
    border-radius:6px;
    border:none;
}

button{
    padding:10px;
    border:none;
    border-radius:6px;
    background:#22c55e;
    color:#000;
    font-weight:bold;
    cursor:pointer;
}

.btn-back{
    display:inline-block;
    background:#3498db;
    color:#fff;
    padding:10px 14px;
    border-radius:10px;
    text-decoration:none;
    font-weight:800;
    border:1px solid transparent;
    transition:.15s ease;
}
.btn-back:hover{filter:brightness(1.06)}

</style>

</head>

<body>

<div class="container">

<h1>📊 Controle de Sessões e Horas/Aula</h1>

<div style="display:flex; gap:10px; margin-bottom:15px; justify-content:center;">
  <a href="/admin_Dashboard.html" class="btn-back">← Dashboard Admin</a>
  <a href="/dashboard_professor_titular.html" class="btn-back">👑 Dashboard Professor</a>
</div>


<div style="display:flex; gap:10px; margin-bottom:15px; justify-content:center;">
  <a href="/admin_Dashboard.html" class="btn-back">← Dashboard Admin</a>
  <a href="/dashboard_professor_titular.html" class="btn-back">👑 Dashboard Professor</a>
</div>


<div class="grid">

<div class="card">
<h2>Check-in de Treino</h2>

<input id="aluno_id" placeholder="ID do aluno">
<select id="tipo_sessao">
<option>Tipo</option>
<option>Normal</option>
<option>Experimental</option>
</select>

<button onclick="registrarSessao()">Registrar Sessão</button>
</div>

<div class="card">
<h2>Horas/Aula</h2>

<p>Total: --</p>
<p>Experimental: --</p>
<p>Saldo: --</p>

</div>

<div class="card">
<h2>Docência</h2>

<input placeholder="Plano de aula">
<input placeholder="Aula ministrada">
<input placeholder="Tipo de treino">
<textarea placeholder="Técnica ministrada"></textarea>

<button>Salvar Docência</button>

</div>

<div class="card">
<h2>Histórico</h2>

<div id="historico-sessoes">Carregando sessões...</div>

</div>

</div>

</div>




<script>
async function registrarSessao(){
    try{
        const alunoId = Number(document.getElementById('aluno_id').value || 0);
        const tipo = (document.getElementById('tipo_sessao').value || 'normal').toLowerCase();

        if(!alunoId){
            alert('Informe o ID do aluno.');
            return;
        }

        const agora = new Date();
        const horaInicio = agora.toLocaleTimeString('pt-BR');

        const res = await fetch('/api/sessoes/criar', {
            method:'POST',
            headers:{'Content-Type':'application/json'},
            body: JSON.stringify({
                aluno_id: alunoId,
                tipo: tipo,
                hora_inicio: horaInicio
            })
        });

        const payload = await res.json();

        if(!payload.ok){
            alert(payload.message || 'Erro ao registrar sessão.');
            return;
        }

        document.getElementById('aluno_id').value = '';
        document.getElementById('tipo_sessao').value = 'Normal';

        await carregarSessoes();
        alert('Sessão registrada com sucesso.');
    }catch(e){
        console.error(e);
        alert('Erro ao registrar sessão.');
    }
}


async function finalizarSessao(id){
    try{
        const agora = new Date();
        const horaFim = agora.toLocaleTimeString('pt-BR');

        const resLista = await fetch('/api/sessoes/listar');
        const dadosLista = await resLista.json();

        if(!dadosLista.ok || !dadosLista.sessoes){
            alert('Não foi possível localizar a sessão.');
            return;
        }

        const sessao = dadosLista.sessoes.find(s => Number(s.id) === Number(id));

        if(!sessao){
            alert('Sessão não encontrada.');
            return;
        }

        let horasAula = sessao.horas_aula || 0;

        if(sessao.hora_inicio){
            const hoje = new Date().toISOString().slice(0,10);

            const inicio = new Date(`${hoje}T${sessao.hora_inicio}`);
            const fim = new Date(`${hoje}T${horaFim}`);

            let diffMs = fim - inicio;
            if (diffMs < 0) diffMs = 0;

            const diffHoras = diffMs / (1000 * 60 * 60);
            horasAula = Math.max(0.5, Number(diffHoras.toFixed(2)));
        }

        const res = await fetch('/api/sessoes/atualizar', {
            method:'POST',
            headers:{'Content-Type':'application/json'},
            body: JSON.stringify({
                id,
                hora_fim: horaFim,
                horas_aula: horasAula
            })
        });

        const payload = await res.json();

        if(!payload.ok){
            alert(payload.message || 'Erro ao finalizar sessão.');
            return;
        }

        await carregarSessoes();
        alert('Treino finalizado com sucesso.');
    }catch(e){
        console.error(e);
        alert('Erro ao finalizar sessão.');
    }
}


async function carregarSessoes(){
    try{
        const res = await fetch('/api/sessoes/listar');
        const payload = await res.json();

        const container = document.getElementById('historico-sessoes');

        if(!payload.ok || !payload.sessoes || !payload.sessoes.length){
            container.innerHTML = "<p>Sem sessões registradas.</p>";
            return;
        }

        container.innerHTML = payload.sessoes.map(s => `
            <div style="background:#0f172a;padding:10px;margin-bottom:10px;border-radius:8px;">
                <strong>ID:</strong> ${s.id ?? '---'} <br>
                <strong>Aluno:</strong> ${s.aluno_id ?? '---'} <br>
                <strong>Data:</strong> ${s.data_sessao ? new Date(s.data_sessao).toLocaleDateString('pt-BR') : '---'} <br>
                <strong>Início:</strong> ${s.hora_inicio || '---'} <br>
                <strong>Fim:</strong> ${s.hora_fim || 'Em andamento'} <br>
                <strong>Tipo:</strong> ${s.tipo || '---'} <br>
                <strong>Horas/Aula:</strong> ${s.horas_aula ?? '---'} <br>
                <strong>Status:</strong> ${s.status || '---'} <br><br>

    ${!s.hora_fim ? `<button onclick="finalizarSessao(${s.id})">Finalizar Treino</button>` : ''}
            </div>
        `).join('');
    }catch(e){
        console.error(e);
        document.getElementById('historico-sessoes').innerHTML = "Erro ao carregar sessões";
    }
}

carregarSessoes();
</script>

</body>

</html>
